<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nischal | Portfolio</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #121216;
            --text-main: #f3f4f6;
            --text-muted: #858699;
            --accent: #00ffaa;
            --border: #1f1f2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 680px;
            width: 100%;
            margin-top: 4rem;
        }

        header {
            margin-bottom: 3.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        section {
            margin-bottom: 3.5rem;
        }

        h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s ease;
        }

        .project-card:hover {
            border-color: var(--accent);
        }

        .project-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent);
            color: var(--bg-color);
        }

        .links-list {
            list-style: none;
        }

        .links-list li {
            margin-bottom: 0.75rem;
        }

        .links-list a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        .links-list a:hover {
            color: var(--accent);
        }

        .links-list span {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER SECTION -->
        <header>
            <h1>Nischal</h1>
            <p class="subtitle">Computer Science Engineer.</p>
        </header>

        <!-- PROJECTS SECTION -->
        <section>
            <h2>Projects</h2>
            
            <div class="project-card">
                <div class="project-title">Project 1</div>
                <div class="project-desc">Placeholder 1.</div>
                <a href="#" class="btn" target="_blank">Launch App &rarr;</a>
            </div>

            <div class="project-card">
                <div class="project-title">Project 2</div>
                <div class="project-desc">Placeholder 2.</div>
                <a href="#" class="btn" target="_blank">View Code &rarr;</a>
            </div>
        </section>

        <!-- LINKS / SOCIALS SECTION -->
        <section>
            <h2>Connect</h2>
            <ul class="links-list">
                <li><a href="#" target="_blank">GitHub</a> <span>/ code footprint</span></li>
                <li><a href="#" target="_blank">Instagram</a> <span>/ thoughts</span></li>
                <li><a href="mailto:24632249@vistas.ac.in">Email</a> <span>/ inbound offers</span></li>
            </ul>
        </section>
    </div>

</body>
</html>
